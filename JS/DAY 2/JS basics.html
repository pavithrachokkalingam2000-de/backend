<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript For loops</title>
</head>
<body>
    <h2>Task-1 Print Numbers</h2>
    <h2>Task-2 Print Even Numbers</h2>
    <h2>Task-3 Multiplication Table</h2>
    <h2>Task-4 Star pattern</h2>
    <h2>Task-5 Number Pattern</h2>
    
    
    <script>
        // Task-1 Print Numbers
        for (let k=1;k<=10;k++){
            console.log(k);
        }

        // Task-2 Print Even Numbers
        for (let p=1;p<=20;p++){
            if(p%2==0){
                console.log(p);
            }
        }

        // Task-3 Multiplication Table
    
        let num=5;
        for (let r=1;r<=10;r++){
            console.log(num+"*"+r+"="+num*r);
     
        }

        // Task-4 Star pattern
          for (let l=1;l<=5;l++){
            let row =" ";
            for (let m=1;m<=l;m++){
                row +="*";
            }
            console.log(row);
          }

        // Task-5 Number Pattern
         for (x=1;x<=5;x++){
            let row =" ";
            for (y=1;y<=x;y++){
                row +=y;

            }
            console.log(row);
         }
        
    </script>
    
</body>
</html>
