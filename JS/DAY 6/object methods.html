<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object methods</title>
</head>
<body>
    <script>
        //Task -1
        let salaries = [15000, 20000, 25000, 30000, 35000];
        let updatedsalaries=salaries.map((salary)=>{
            return salary+2000;
        });
        console.log(salaries);
        console.log(updatedsalaries);
        //Task -2
        let mark =[35, 78, 42, 90, 25, 67, 55];
        let eligiblestudents=mark.filter((mark)=>{
            return mark>=50;

          });
          console.log(eligiblestudents);
          //Task -3
          let products=[
             { id: 101, name: "Laptop", price: 55000 },

             { id: 102, name: "Mouse", price: 800 },

             { id: 103, name: "Keyboard", price: 1500 },

             { id: 104, name: "Monitor", price: 12000 }

             ];

             let product = products.find((item)=>{
                return item.id===103;

             });
             console.log(product);
             console.log(product.name);

             //Task -4
             let cart=[
                 { name: "Shirt", price: 1200 },

                 { name: "Shoes", price: 2500 },

                 { name: "Watch", price: 3000 },

                 { name: "Bag", price: 1500 }
                ];
                let total=cart.reduce((acc,item)=>{
                    return acc+ item.price;
                },0);
                console.log(total);
                //Task -5
                let students=[
                    { id: 1, name: "Arun", mark: 85 },
                    { id: 2, name: "Bala", mark: 45 },
                    { id: 3, name: "Kumar", mark: 72 },
                    { id: 4, name: "Priya", mark: 95 },
                    { id: 5, name: "Ravi", mark: 38 }
                  ];
                  let studentnames=students.map((student)=>{
                    return student.name;

                  });
                  console.log(studentnames);

                  let passedStudents=students.filter((student)=>{
                    return student.mark>60;
                  });
                  console.log(passedStudents);

                  let student=students.find((student)=>{
                    return student.id===4;
                  });
                  console.log(student);

                  let totalMarks=students.reduce((total,student)=>{
                    return total+student.mark;

                  },0);
                  console.log(totalMarks);

                  let averageMark=totalMarks/students.length;

                  console.log(averageMark);
                
          
    </script>
    
</body>
</html>
